name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Host unit tests at the C++20 language floor (and C++23 where the toolchain
  # supports it, driven automatically by the test CMakeLists) on GCC and Clang,
  # across -O0/-O2/-Os to catch optimization-sensitive issues.
  # ---------------------------------------------------------------------------
  host-tests:
    name: Host tests (${{ matrix.compiler.cxx }} ${{ matrix.opt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }
        opt: [ '-O0', '-O2', '-Os' ]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.compiler.cc }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_FLAGS="${{ matrix.opt }}"
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # AddressSanitizer + UndefinedBehaviorSanitizer host run.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Sanitizers (ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang
      - name: Configure
        run: cmake -S . -B build-san -G Ninja -DARDUINOAWAIT_ENABLE_SANITIZERS=ON
        env:
          CC: clang
          CXX: clang++
      - name: Build
        run: cmake --build build-san
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  # ---------------------------------------------------------------------------
  # Arduino target compile checks for the Empty build-skeleton example across
  # the full first-class target matrix (AGENTS.md §16).
  # ---------------------------------------------------------------------------
  arduino:
    name: Arduino compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RP2040
            fqbn: rp2040:rp2040:rpipico
            core: rp2040:rp2040
            url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          - name: RP2350 (Arm)
            fqbn: rp2040:rp2040:rpipico2
            core: rp2040:rp2040
            url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          - name: RP2350 (RISC-V)
            fqbn: rp2040:rp2040:rpipico2:arch=riscv
            core: rp2040:rp2040
            url: https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          - name: ESP32
            fqbn: esp32:esp32:esp32
            core: esp32:esp32
            url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          - name: ESP32-S3
            fqbn: esp32:esp32:esp32s3
            core: esp32:esp32
            url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2
      - name: Install core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls ${{ matrix.url }}
          arduino-cli core update-index
          arduino-cli core install ${{ matrix.core }}
      - name: Compile Empty example
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            examples/Empty
      - name: Compile clock validation sketch (links the native clock backend)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/ClockMonotonic
      - name: Compile frame pool validation sketch (instantiates the allocator)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/FramePoolCheck
      - name: Compile task lifecycle sketch (coroutine + pool integration)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/TaskLifecycle
      - name: Compile scheduler validation sketch (fixed-slot scheduler + poll)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/SchedulerRun
      - name: Compile timer wait validation sketch (delay + native clock)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/TimerWait
      - name: Compile child await validation sketch (co_await child Task)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/ChildAwait
      - name: Compile event wake validation sketch (Event multi-waiter FIFO)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/EventWake
      - name: Compile flag IRQ validation sketch (ThreadSafeFlag from an ISR)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/FlagIRQ
      - name: Compile queue producer/consumer validation sketch (bounded Queue FIFO)
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            hardware/QueueProducerConsumer
      - name: Compile 01_Blink golden example
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            examples/01_Blink
      - name: Compile 02_TwoTasks golden example
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            examples/02_TwoTasks
      - name: Compile 03_YieldFairness golden example
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            examples/03_YieldFairness
      - name: Compile 04_ParentChild golden example
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            examples/04_ParentChild
      - name: Compile 05_Event golden example
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            examples/05_Event
      - name: Compile 06_ThreadSafeFlagIRQ golden example
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            examples/06_ThreadSafeFlagIRQ
      - name: Compile 07_QueueProducerConsumer golden example
        run: |
          arduino-cli compile \
            --fqbn ${{ matrix.fqbn }} \
            --library . \
            examples/07_QueueProducerConsumer

  # ---------------------------------------------------------------------------
  # Validate Arduino library metadata.
  #
  # The frozen public name "ArduinoAwait" starts with the reserved "Arduino"
  # prefix, which arduino-lint rule LP012 reports as an error at every compliance
  # level. That prefix is intentional (fixed by V1_API_CONTRACT.md) and only
  # matters for a future Library Manager publication decision; we deliberately do
  # NOT enable arduino-lint "official" mode. The gate script validates the
  # metadata and fails on any error EXCEPT the single documented LP012 deviation,
  # so genuine metadata regressions still break CI.
  # ---------------------------------------------------------------------------
  library-metadata:
    name: Arduino library metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-lint
        run: |
          curl -fsSL https://github.com/arduino/arduino-lint/releases/download/1.3.0/arduino-lint_1.3.0_Linux_64bit.tar.gz -o arduino-lint.tar.gz
          tar -xzf arduino-lint.tar.gz
          ./arduino-lint --version
      - name: Lint and gate metadata
        run: |
          set +e
          ./arduino-lint --compliance specification --format json "$GITHUB_WORKSPACE" > lint.json
          status=$?
          set -e
          # arduino-lint exits 0 (no errors) or 1 (rule errors found, e.g. the
          # expected LP012). Any other exit code means the linter itself failed;
          # fail closed rather than gating on a possibly-truncated report.
          if [ "$status" -gt 1 ]; then
            echo "::error::arduino-lint exited with unexpected status $status"
            cat lint.json || true
            exit 1
          fi
          python3 .github/scripts/lint_metadata_gate.py lint.json
