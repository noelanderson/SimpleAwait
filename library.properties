name=ArduinoAwait
version=0.1.0
author=ArduinoAwait contributors
maintainer=ArduinoAwait contributors
sentence=Deterministic, fixed-memory cooperative coroutine library using native C++20 coroutines.
paragraph=ArduinoAwait provides cooperative concurrency for Arduino-class microcontrollers (RP2040, RP2350, ESP32) using standard C++20 coroutines with a statically allocated scheduler and coroutine frame pool. No RTOS, no heap allocation for coroutine frames, and deterministic failure behavior. It provides lazy Tasks, a fair cooperative scheduler, yield/delay timers, parent/child await, scheduler-local Event and bounded Queue, an ISR-safe ThreadSafeFlag bridge, and waitUntil. This is a pre-release under V1 hardening; on-device hardware validation is a pre-release gate.
category=Timing
