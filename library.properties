sentence=Deterministic, fixed-memory cooperative coroutine library using native C++20 coroutines.
paragraph=ArduinoAwait provides cooperative concurrency for Arduino-class microcontrollers (RP2040, RP2350, ESP32) using standard C++20 coroutines with a statically allocated scheduler and coroutine frame pool. No RTOS, no heap allocation for coroutine frames, and deterministic failure behavior. This release is the M0 build skeleton; the scheduler and async primitives are added in subsequent milestones.
